<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Change password - Employee Directory</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <span class="brand">Employee Directory</span>
    <nav>
      <a href="index.html">Directory</a>
      <a href="employees.html">Employees</a>
      <a href="organization.html">Organization</a>
      <a href="change-password.html" class="active">Password</a>
      <a href="login.html">Login</a>
    </nav>
    <span id="api-status" class="api-status">Checking API...</span>
  </header>

  <main>
    <h1>Change your password</h1>
    <div id="message" class="message" hidden></div>
    <section class="card">
      <!-- OWNER: Jana - password change (security control); changes only the logged-in user's own password -->
      <p id="first-login" class="muted" hidden>Your account was created by HR with a temporary
        password. Choose your own password before you continue.</p>
      <form id="password-form">
        <label for="current-password">Current password</label>
        <input id="current-password" type="password" required autocomplete="current-password">
        <label for="new-password">New password</label>
        <input id="new-password" type="password" required minlength="8" maxlength="72" autocomplete="new-password">
        <p class="muted">At least 8 characters, with a letter and a number, and different from the current one.</p>
        <label for="confirm-password">Confirm new password</label>
        <input id="confirm-password" type="password" required minlength="8" maxlength="72" autocomplete="new-password">
        <button type="submit">Change password</button>
      </form>
    </section>
  </main>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/change-password.js"></script>
</body>
</html>
